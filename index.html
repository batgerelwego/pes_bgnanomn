<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Багшийн ирц — Админ</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --tx:#1c2430; --mu:#677489; --bd:#dfe3ea; --ac:#1f5fbf; --ok:#14804a; --warn:#b4540a; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151a21; --card:#1e2530; --tx:#e6eaf0; --mu:#93a0b4; --bd:#303a49; --ac:#6aa3ff; --ok:#4cc38a; --warn:#f0a04b; --err:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--tx); }
  main { max-width:1400px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:14px; margin-bottom:14px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--mu); gap:3px; }
  input { padding:7px 9px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--tx); font:inherit; }
  button { padding:8px 14px; border:1px solid var(--ac); background:var(--ac); color:#fff; border-radius:6px; font:inherit; cursor:pointer; }
  button.sec { background:transparent; color:var(--ac); }
  button.danger { background:transparent; border-color:var(--err); color:var(--err); }
  .status { display:flex; flex-wrap:wrap; gap:14px; font-size:13px; margin-top:10px; color:var(--mu); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--mu); margin-right:6px; }
  .on .dot { background:var(--ok); } .off .dot { background:var(--err); } .warn .dot { background:var(--warn); }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:7px 9px; border-bottom:1px solid var(--bd); text-align:left; white-space:nowrap; }
  th { color:var(--mu); font-weight:600; font-size:12px; }
  .late { color:var(--warn); font-weight:600; } .okc { color:var(--ok); } .extra { color:var(--mu); }
  .sum { color:var(--mu); font-size:13px; margin:0 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Багшийн ирц бүртгэлийн админ</h1>

  <div class="card">
    <div class="row">
      <label>Төхөөрөмжийн IP<input id="ip" placeholder="192.168.1.50" size="16"></label>
      <label>Админ PIN<input id="pin" type="password" size="10"></label>
      <button id="connect">Холбох</button>
      <button id="settime" class="sec">Цаг тааруулах (энэ компьютерийн цаг)</button>
    </div>
    <div class="status">
      <span id="st-conn" class="off"><i class="dot"></i><b>Холболт:</b> <span>тохируулаагүй</span></span>
      <span id="st-clock" class=""><i class="dot"></i><b>Төхөөрөмжийн цаг:</b> <span>—</span></span>
      <span id="st-arch"><i class="dot"></i><b>Хөтөч дээрх хуулбар:</b> <span>0 бүртгэл</span></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label>Google Sheet (Apps Script) URL<input id="surl" size="48" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <label>Админ нууц үг<input id="spass" type="password" size="14" autocomplete="off"></label>
      <button id="sload">Sheet-ээс унших</button>
    </div>
    <div class="status">
      <span id="st-sheet"><i class="dot"></i><b>Google Sheet:</b> <span>холбоогүй</span></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label>Эхлэх огноо<input type="date" id="from"></label>
      <label>Дуусах огноо<input type="date" id="to"></label>
      <label>Багшийн код<input id="q" placeholder="M.EC21" size="12"></label>
      <button id="csv">CSV татах</button>
      <button id="xls" class="sec">XLS татах</button>
      <button id="clear" class="danger">Төхөөрөмжийн санах ойг цэвэрлэх</button>
    </div>
  </div>

  <div class="card">
    <p class="sum" id="sum"></p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>№</th><th>Огноо</th><th>Багшийн код</th><th>Пар</th><th>Хуваарь</th><th>Эхэлсэн (уншуулсан)</th><th>Эхэлсэн (бүртгэсэн)</th><th>Эхлэх төлөв</th><th>Тарсан (уншуулсан)</th><th>Тарсан (бүртгэсэн)</th><th>Дуусах төлөв</th><th>Үргэлжилсэн (мин)</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const PSTART = [0,460,560,660,780,880,980,1080,1180];   // пар бүрийн эхлэх минут
const K_ARCH = 'att_archive_v1', K_CFG = 'att_cfg_v1';
let arch = {}, cfg = { ip:'', pin:'' }, since = 0, timer = null;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');

// ---------- Хөтөч дээрх давхар хадгалалт ----------
function load() {
  try { arch = JSON.parse(localStorage.getItem(K_ARCH) || '{}'); } catch(e) { arch = {}; }
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(K_CFG) || '{}')); } catch(e) {}
}
function saveArch() { try { localStorage.setItem(K_ARCH, JSON.stringify(arch)); } catch(e) { setSt('st-arch','warn','хадгалах зай дүүрсэн — CSV татаж аваарай'); } }
function saveCfg()  { try { localStorage.setItem(K_CFG, JSON.stringify(cfg)); } catch(e) {} }

function setSt(id, cls, text) { const el = $(id); el.className = cls; el.querySelector('span').textContent = text; }

// ---------- Цаг, форматлах ----------
const dStr = e => { const d = new Date(e*1000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const tStr = (e, sec) => { const d = new Date(e*1000); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}` + (sec ? `:${pad(d.getUTCSeconds())}` : ''); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Эхлэх, дуусах уншилтыг (өдөр, код, пар) -р нэг мөр болгон нэгтгэнэ
function lessons() {
  const map = {}, out = [];
  Object.values(arch).forEach(x => {
    const day = Math.floor(x.a / 86400);
    if (!x.p) { out.push({ day, id:x.id, p:0, s:x, e:null, sort:x.a }); return; }   // Нэмэлт
    const k = day + '|' + x.id + '|' + x.p;
    const l = map[k] || (map[k] = { day, id:x.id, p:x.p, s:null, e:null, sort:x.a });
    if (x.t === 1) l.e = x; else l.s = x;
    if (x.a < l.sort) l.sort = x.a;
  });
  return out.concat(Object.values(map)).sort((a, b) => a.sort - b.sort);
}

function rowOf(l) {
  const nowE = Math.floor(Date.now()/1000) + 8*3600;
  const dayStart = l.day * 86400;
  const r = { date: dStr(dayStart), id: l.id, p: l.p || 'Нэмэлт', sched:'—',
              sAct:'—', sCnt:'—', sStat:'—', eAct:'—', eCnt:'—', eStat:'—', dur:'', cls:'okc', late:false, early:false, open:false, noStart:false };
  if (!l.p) {
    r.sAct = tStr(l.s.a, true); r.sCnt = tStr(l.s.c, true); r.sStat = 'Нэмэлт (хичээлийн бус цаг)'; r.cls = 'extra';
    return r;
  }
  const st = dayStart + PSTART[l.p]*60, en = st + 90*60;
  r.sched = `${tStr(st)}–${tStr(en)}`;
  if (l.s) {
    r.sAct = tStr(l.s.a, true); r.sCnt = tStr(l.s.c, l.s.c !== st);
    if (l.s.c === st) r.sStat = 'Цагтаа';
    else { const m = Math.floor((l.s.a - st)/60); r.sStat = `Хоцорсон (${m} мин)`; r.late = true; }
  } else { r.sStat = 'Эхлэх уншилтгүй'; r.noStart = true; }
  if (l.e) {
    r.eAct = tStr(l.e.a, true); r.eCnt = tStr(l.e.c, l.e.c !== en);
    if (l.e.c === en) r.eStat = 'Цагтаа';
    else if (l.e.a < en) { r.eStat = `Эрт тарсан (${Math.floor((en - l.e.a)/60)} мин)`; r.early = true; }
    else { r.eStat = `Хоцорч тарсан (${Math.floor((l.e.a - en)/60)} мин)`; r.early = true; }
    if (l.s) r.dur = Math.round((l.e.c - l.s.c)/60);
  } else if (nowE >= en + 11*60) { r.eStat = 'Дуусах уншилтгүй'; r.open = true; }
  else if (l.s) r.eStat = 'Үргэлжилж байна';
  r.cls = (r.late || r.early || r.open || r.noStart) ? 'late' : 'okc';
  return r;
}

function filtered() {
  const f = $('from').value, t = $('to').value, q = $('q').value.trim().toUpperCase();
  return lessons().filter(l => { const d = dStr(l.day * 86400); return (!f || d >= f) && (!t || d <= t) && (!q || l.id.includes(q)); });
}

function render() {
  const list = filtered().map(rowOf);
  $('tb').innerHTML = list.map((r,i) =>
    `<tr><td>${i+1}</td><td>${r.date}</td><td><b>${esc(r.id)}</b></td><td>${r.p}</td><td>${r.sched}</td>` +
    `<td>${r.sAct}</td><td>${r.sCnt}</td><td class="${r.late||r.noStart?'late':(r.cls==='extra'?'extra':'okc')}">${esc(r.sStat)}</td>` +
    `<td>${r.eAct}</td><td>${r.eCnt}</td><td class="${r.early||r.open?'late':'okc'}">${esc(r.eStat)}</td><td>${r.dur === '' ? '—' : r.dur}</td></tr>`).join('');
  const n = f => list.filter(f).length;
  $('sum').textContent = `Нийт ${list.length} мөр · хоцорч эхэлсэн ${n(r => r.late)} · эрт/хоцорч тарсан ${n(r => r.early)} · дуусах уншилтгүй ${n(r => r.open)} · нэмэлт ${n(r => r.cls === 'extra')}`;
  setSt('st-arch', 'on', `${Object.keys(arch).length} бүртгэл`);
}

// ---------- Төхөөрөмжтэй холбогдох ----------
const base = () => `http://${cfg.ip}`;
const auth = () => `key=${encodeURIComponent(cfg.pin)}`;

async function api(path) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 7000);
  try { return await fetch(`${base()}${path}`, { signal: ctl.signal, cache:'no-store' }); }
  finally { clearTimeout(to); }
}

async function poll() {
  if (!cfg.ip) return;
  try {
    const r = await api(`/api/records?${auth()}&since=${since}`);
    if (r.status === 401) { setSt('st-conn','warn','PIN буруу'); return; }
    const d = await r.json();
    if (d.next < since) { since = 0; return poll(); }     // төхөөрөмж цэвэрлэгдсэн/дахин асаасан
    let added = 0;
    for (const x of d.records) {
      const k = x.id + '|' + x.a;
      if (!arch[k]) { arch[k] = { id:x.id, p:x.p, a:x.a, c:x.c, t:x.t === 1 ? 1 : 0 }; added++; }
    }
    since = d.next;
    if (added) saveArch();
    setSt('st-conn', 'on', `холбогдсон (${new Date().toLocaleTimeString()})`);
    if (d.ok) setSt('st-clock', 'on', `${dStr(d.now)} ${tStr(d.now,true)}`);
    else setSt('st-clock', 'warn', 'тохируулаагүй — "Цаг тааруулах" дарна уу');
    render();
  } catch(e) {
    setSt('st-conn', 'off', 'холбогдохгүй байна — хөтөч дээрх хуулбар харагдаж байна');
  }
}

function start() {
  cfg.ip = $('ip').value.trim(); cfg.pin = $('pin').value; saveCfg();
  since = 0; clearInterval(timer);
  if (cfg.ip) { poll(); timer = setInterval(poll, 15000); }
}

$('connect').onclick = start;
$('settime').onclick = async () => {
  if (!cfg.ip) return alert('Эхлээд төхөөрөмжийн IP-г оруулна уу');
  const t = Math.floor(Date.now()/1000) + 8*3600;             // Монгол UTC+8
  try { const r = await api(`/api/time?${auth()}&t=${t}`); if (r.ok) poll(); else alert('Алдаа: ' + r.status); }
  catch(e) { alert('Төхөөрөмжтэй холбогдож чадсангүй'); }
};
$('clear').onclick = async () => {
  if (!confirm('Төхөөрөмжийн санах ойн бүртгэлийг устгах уу?\n(Энэ хөтөч дээрх хуулбар устахгүй.)')) return;
  await poll();                                                // эхлээд хамгийн сүүлийн өгөгдлийг хуулна
  try { const r = await api(`/api/clear?${auth()}`); alert(r.ok ? 'Цэвэрлэлээ' : 'Алдаа: ' + r.status); }
  catch(e) { alert('Төхөөрөмжтэй холбогдож чадсангүй'); }
};
['from','to','q'].forEach(id => $(id).addEventListener('input', render));

// ---------- Google Sheet-ээс унших (нууц үгээр) ----------
let sheetPass = '', sheetAfter = 0, sheetTimer = null;
async function pullSheet() {
  if (!cfg.sheet || !sheetPass) return;
  try {
    const r = await fetch(cfg.sheet, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // preflight хэрэггүй
      body: JSON.stringify({ act: 'read', pass: sheetPass, after: sheetAfter }),
      redirect: 'follow'
    });
    const d = await r.json();
    if (!d.ok) { setSt('st-sheet', 'warn', d.error === 'auth' ? 'нууц үг буруу' : 'алдаа: ' + d.error); return; }
    let added = 0;
    for (const x of d.records) {
      const k = x.id + '|' + x.a;
      if (!arch[k]) { arch[k] = { id:String(x.id), p:Number(x.p) || 0, a:Number(x.a), c:Number(x.c), t:Number(x.t) === 1 ? 1 : 0 }; added++; }
      if (x.a > sheetAfter) sheetAfter = x.a;
    }
    if (added) saveArch();
    setSt('st-sheet', 'on', `холбогдсон (${new Date().toLocaleTimeString()}), шинэ ${added}`);
    render();
  } catch (e) {
    setSt('st-sheet', 'off', 'холбогдохгүй байна — хөтөч дээрх хуулбар харагдаж байна');
  }
}
$('sload').onclick = () => {
  cfg.sheet = $('surl').value.trim(); sheetPass = $('spass').value; saveCfg();
  sheetAfter = 0; clearInterval(sheetTimer);
  if (!cfg.sheet || !sheetPass) { setSt('st-sheet', 'warn', 'URL болон нууц үгээ оруулна уу'); return; }
  pullSheet(); sheetTimer = setInterval(pullSheet, 60000);
};

// ---------- Экспорт ----------
const HEAD = ['№','Огноо','Багшийн код','Пар','Хуваарь','Эхэлсэн (уншуулсан)','Эхэлсэн (бүртгэсэн)','Эхлэх төлөв','Тарсан (уншуулсан)','Тарсан (бүртгэсэн)','Дуусах төлөв','Үргэлжилсэн (мин)'];
function tableRows() {
  return filtered().map(rowOf).map((r,i) => [i+1, r.date, r.id, r.p, r.sched, r.sAct, r.sCnt, r.sStat, r.eAct, r.eCnt, r.eStat, r.dur]);
}
function download(name, mime, content) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const stamp = () => dStr(Math.floor(Date.now()/1000) + 8*3600);

$('csv').onclick = () => {
  const lines = [HEAD, ...tableRows()].map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(','));
  download(`irts_${stamp()}.csv`, 'text/csv;charset=utf-8', '\ufeff' + lines.join('\r\n'));
};
$('xls').onclick = () => {
  const th = HEAD.map(h => `<th>${esc(h)}</th>`).join('');
  const tr = tableRows().map(r => '<tr>' + r.map(v => `<td>${esc(v)}</td>`).join('') + '</tr>').join('');
  const html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1"><tr>${th}</tr>${tr}</table></body></html>`;
  download(`irts_${stamp()}.xls`, 'application/vnd.ms-excel', html);
};

// ---------- Эхлэл ----------
load();
$('ip').value = cfg.ip; $('pin').value = cfg.pin; $('surl').value = cfg.sheet || '';
$('from').value = $('to').value = stamp();
render();
if (cfg.ip) start();
</script>
</body>
</html>
